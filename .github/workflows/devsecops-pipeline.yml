name: DevSecOps SSDLC Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: read-only by default, each job asks only for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (tags are mutable; see tj-actions/changed-files, 2025).
jobs:
  # =========================================================================
  # 1. SECRET SCANNING (Gitleaks) - full git history
  # =========================================================================
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Scan git history (blocks on any secret)
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # =========================================================================
  # 2. UNIT TESTS (node:test)
  # =========================================================================
  unit-tests:
    name: 2. Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test

  # =========================================================================
  # 3. SAST (Semgrep) - blocks on ERROR/WARNING findings
  # =========================================================================
  sast-semgrep:
    name: 3. SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep scan (JavaScript, Node.js, OWASP Top 10, Dockerfile, GitHub Actions + custom rules)
        run: |
          semgrep scan --metrics=off \
            --config p/javascript --config p/nodejsscan --config p/owasp-top-ten \
            --config p/dockerfile --config p/github-actions --config .semgrep.yml \
            --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Security gate (fail on ERROR/WARNING, INFO is reported only)
        run: |
          python3 - <<'EOF'
          import json, sys
          results = [r for run in json.load(open("semgrep.sarif"))["runs"] for r in run["results"]]
          blocking = [r for r in results if r.get("level") in ("error", "warning")]
          for r in blocking:
              loc = r["locations"][0]["physicalLocation"]
              print(f'{r["level"].upper()}: {r["ruleId"]} at {loc["artifactLocation"]["uri"]}:{loc["region"]["startLine"]}')
          print(f"Semgrep: {len(results)} finding(s), {len(blocking)} blocking")
          sys.exit(1 if blocking else 0)
          EOF

  # =========================================================================
  # 4. SAST & QUALITY GATE (SonarQube) - runs when SONAR_TOKEN is configured
  # =========================================================================
  sast-sonarqube:
    name: 4. SAST & Quality Gate (SonarQube)
    runs-on: ubuntu-latest
    needs: secret-scanning
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # sonar.qualitygate.wait=true (sonar-project.properties) makes this step fail when the gate fails.
      - name: SonarQube scan + Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2

      - name: SonarQube skipped (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice title=SonarQube::SONAR_TOKEN is not configured, stage skipped."

  # =========================================================================
  # 5. SCA (Snyk, or npm audit without a Snyk token) - blocks on HIGH/CRITICAL
  # =========================================================================
  sca:
    name: 5. SCA Dependency Scanning (Snyk / npm audit)
    runs-on: ubuntu-latest
    needs: secret-scanning
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Snyk test (blocks on HIGH/CRITICAL)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npx --yes snyk@1.1307.4 test --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: npm audit (blocks on HIGH/CRITICAL, used when no Snyk token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: npm audit --omit=dev --audit-level=high

  # =========================================================================
  # 6. CONTAINER SECURITY (Trivy) - Dockerfile misconfigurations + image CVEs
  # =========================================================================
  container-security:
    name: 6. Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: [unit-tests, sast-semgrep, sast-sonarqube, sca]
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: secops-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile misconfigurations (blocks on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Image vulnerabilities report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Image gate (blocks on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # =========================================================================
  # 7. DAST (OWASP ZAP baseline) against the container that would ship
  # =========================================================================
  dast:
    name: 7. DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the container
        run: |
          docker build --tag secops-app:dast .
          docker run --detach --name app --publish 3000:3000 --read-only secops-app:dast
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && exit 0; sleep 2; done
          docker logs app; exit 1

      # Rules marked FAIL in .zap/rules.tsv break the build; WARN is reported only (-I).
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

  # =========================================================================
  # 8. PUBLISH (main only): push to GHCR with SBOM + provenance, keyless cosign signature
  # =========================================================================
  publish:
    name: 8. Publish Signed Image (GHCR)
    runs-on: ubuntu-latest
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # GitHub OIDC token for keyless signing (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SBOM + SLSA provenance attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign by digest (keyless) and verify
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/"
